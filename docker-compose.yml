version: "3.9"

# agentns — complete local stack
#
# In-memory only (no MongoDB):
#   docker compose up
#
# With local MongoDB (persistent registry):
#   docker compose --profile mongo up
#
# With MongoDB Atlas (cloud):
#   MONGODB_URI="mongodb+srv://user:pass@cluster.mongodb.net/" docker compose up

services:

  # ── agentns ──────────────────────────────────────────────────────────────────
  agentns:
    build: .
    image: agentns:latest
    container_name: agentns
    ports:
      - "${AGENTNS_PORT:-8200}:8200"
    environment:
      AGENTNS_PORT:            "${AGENTNS_PORT:-8200}"
      AGENTNS_NAMESPACE:       "${AGENTNS_NAMESPACE:-agents.local}"
      AGENTNS_TLD:             "${AGENTNS_TLD:-agentns.local}"
      AGENTNS_HEALTH_INTERVAL: "${AGENTNS_HEALTH_INTERVAL:-30}"
      AGENTNS_GEOCODING:       "${AGENTNS_GEOCODING:-on}"
      # MongoDB — set MONGODB_URI to connect.
      # When using --profile mongo, the local container is used automatically.
      # Leave empty to run in in-memory mode (registry lost on restart).
      MONGODB_URI:  "${MONGODB_URI:-mongodb://agentns-mongo:27017/}"
      MONGODB_DB:   "${MONGODB_DB:-agentns}"
      # Proxy — optional Agentgateway integration
      AGENTNS_PROXY_HOST: "${AGENTNS_PROXY_HOST:-}"
      AGENTNS_PROXY_PORT: "${AGENTNS_PROXY_PORT:-8400}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8200/health')"]
      interval: 30s
      timeout:  5s
      retries:  3
    networks:
      - agentns-net

  # ── local MongoDB (optional — start with --profile mongo) ────────────────────
  mongo:
    image: mongo:7
    container_name: agentns-mongo
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: agentns
    restart: unless-stopped
    profiles:
      - mongo
    networks:
      - agentns-net

networks:
  agentns-net:
    driver: bridge

volumes:
  mongo-data:
