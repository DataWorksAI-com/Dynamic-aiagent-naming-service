[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name        = "agentns"
version     = "2.0.0"
description = "Agent Name Service — pluggable service discovery for multi-agent systems"
readme      = "README.md"
license     = { text = "MIT" }
authors     = [{name = "DataWorksAI", email = "contact@dataworksai.com"}]
requires-python = ">=3.10"

keywords = [
  "agents", "service-discovery", "multi-agent", "AI", "sidecar",
  "A2A", "LLM", "agent-routing", "nameservice", "agentns",
]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
  "Topic :: Internet :: Name Service (DNS)",
  "Framework :: FastAPI",
]

# Core deps — httpx and pydantic are lightweight enough to include always
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.29.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]

# Rate limiting (strongly recommended for production)
ratelimit = ["slowapi>=0.1.9"]

# MongoDB persistence
mongo = ["motor>=3.4.0"]

# Static registry YAML support
yaml = ["pyyaml>=6.0"]

# Full server stack (everything above)
server = [
  "slowapi>=0.1.9",
  "pyyaml>=6.0",
]

# Development tools
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.27.0",
  "black",
  "ruff",
  "slowapi>=0.1.9",
  "pyyaml>=6.0",
]

# Install everything
all = [
  "agentns[server,mongo]",
]

[project.urls]
Homepage      = "https://github.com/tonystark3110/agentns"
Documentation = "https://github.com/tonystark3110/agentns#readme"
"Bug Tracker" = "https://github.com/tonystark3110/agentns/issues"

[project.scripts]
agentns-server = "agentns.server:main"

[tool.setuptools.packages.find]
where   = ["."]
include = ["agentns*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length    = 100
target-version = "py310"
