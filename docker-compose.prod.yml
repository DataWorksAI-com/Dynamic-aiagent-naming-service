# =============================================================================
# agentns — Production Docker Compose Override
# =============================================================================
#
# Use on top of docker-compose.yml for production deployments.
#
# With MongoDB Atlas (recommended for production):
#   MONGODB_URI="mongodb+srv://..." docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# With bundled MongoDB:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile mongo up -d
#
# All sensitive values come from environment or .env file.
# =============================================================================

version: "3.9"

services:

  agentns:
    ports:
      - "0.0.0.0:${AGENTNS_PORT:-8200}:8200"
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "512M"
        reservations:
          cpus: "0.25"
          memory: "128M"
    environment:
      AGENTNS_PORT:            "${AGENTNS_PORT:-8200}"
      AGENTNS_TLD:             "${AGENTNS_TLD}"
      AGENTNS_NAMESPACE:       "${AGENTNS_NAMESPACE}"
      AGENTNS_HEALTH_INTERVAL: "${AGENTNS_HEALTH_INTERVAL:-30}"
      AGENTNS_GEOCODING:       "${AGENTNS_GEOCODING:-on}"
      MONGODB_URI:             "${MONGODB_URI}"
      MONGODB_DB:              "${MONGODB_DB:-agentns}"
      AGENTNS_PROXY_HOST:      "${AGENTNS_PROXY_HOST:-}"
      AGENTNS_PROXY_PORT:      "${AGENTNS_PROXY_PORT:-8400}"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8200/health')"]
      interval: 15s
      timeout:  5s
      retries:  5
      start_period: 15s

  mongo:
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: "1G"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_ROOT_USER:-agentns}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_ROOT_PASS}"
      MONGO_INITDB_DATABASE:      "agentns"

volumes:
  mongo-data:
    driver: local
